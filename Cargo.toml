[workspace]
members = ["crates/lapis-app-core", "crates/lapis-app-protocol", "crates/lapis-server"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.dev.package.scrypt]
opt-level = 3
