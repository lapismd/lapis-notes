name: lapis-server

services:
  lapis-server:
    build:
      context: ../..
      dockerfile: packages/server-node/Dockerfile
    ports:
      - "8787:8787"
    environment:
      LAPIS_SERVER_ORIGIN: ${LAPIS_SERVER_ORIGIN:-http://localhost:8787}
      LAPIS_SERVER_INSECURE_COOKIE: ${LAPIS_SERVER_INSECURE_COOKIE:-1}
      LAPIS_SERVER_BOOTSTRAP_USERNAME: ${LAPIS_SERVER_BOOTSTRAP_USERNAME:-owner}
      LAPIS_SERVER_BOOTSTRAP_PASSWORD_FILE: /run/secrets/lapis_bootstrap_password
      LAPIS_SERVER_BUILD_ID: ${LAPIS_SERVER_BUILD_ID:-local-container}
      LAPIS_SERVER_TRUST_PROXY: ${LAPIS_SERVER_TRUST_PROXY:-0}
    secrets:
      - lapis_bootstrap_password
    volumes:
      - lapis_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    stop_grace_period: 20s
    restart: unless-stopped

secrets:
  lapis_bootstrap_password:
    file: ./secrets/bootstrap-password

volumes:
  lapis_data:
