<!doctype html>
<html lang="en" class="light theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#005eac" />
    <meta
      name="description"
      content="Deno desktop host for Lapis Notes."
    />
    <title>Lapis Notes</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #f8fafc;
        color: #1f2328;
      }

      #lapis-boot-status {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #6b7280;
        font: 13px/1.45 system-ui, sans-serif;
        letter-spacing: 0.01em;
        text-align: center;
      }

      .lapis-boot-status__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.875rem;
        transform: translateY(-2vh);
      }

      .lapis-boot-status__logo {
        width: 5rem;
        height: 5rem;
        object-fit: contain;
        filter: drop-shadow(0 1rem 2rem rgb(0 94 172 / 0.14));
      }

      .lapis-boot-status__text {
        margin: 0;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f172a;
          color: #e5e7eb;
        }

        #lapis-boot-status {
          color: #9ca3af;
        }

        .lapis-boot-status__logo {
          filter: drop-shadow(0 1rem 2rem rgb(0 94 172 / 0.28));
        }
      }
    </style>
    <script>
      globalThis.__LAPIS_DENO_BINDINGS__ = typeof bindings !== "undefined";
      globalThis.__LAPIS_RENDERER_ERRORS__ = [];
      function reportRendererError(message) {
        const errors = globalThis.__LAPIS_RENDERER_ERRORS__;
        errors.push(message);
        const status = document.getElementById("lapis-boot-status");
        if (status) status.textContent = message;
      }
      window.addEventListener("error", (event) => {
        reportRendererError(String(event.message ?? event.error ?? "Unknown error"));
      });
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        reportRendererError(
          reason instanceof Error ? reason.message : String(reason),
        );
      });
    </script>
  </head>
  <body>
    <div id="lapis-boot-status" role="status" aria-live="polite">
      <div class="lapis-boot-status__content">
        <img
          class="lapis-boot-status__logo"
          src="/src/assets/lapis-logo.svg"
          alt="Lapis Notes"
        />
        <p class="lapis-boot-status__text">Loading…</p>
      </div>
    </div>
    <div id="app"></div>
    <script>
      if (!globalThis.__LAPIS_DENO_BINDINGS__) {
        reportRendererError(
          "Opened outside the Deno desktop window. bindings.invoke is not available on this page.",
        );
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
