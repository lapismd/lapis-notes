name: Prepare Lapis Notes workspace
description: Verify the pinned CI toolchain and install the frozen workspace graph.

runs:
  using: composite
  steps:
    - name: Trust the container checkout
      shell: bash
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
    - name: Install pinned Deno runtime
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      with:
        deno-version: v2.9.7
    - name: Verify pinned toolchain
      shell: bash
      run: |
        set -euo pipefail
        test "$(node --version)" = "v24.15.0"
        test "$(pnpm --version)" = "10.34.5"
        test "$(playwright --version)" = "Version 1.61.1"
        test "$(mdbook --version)" = "mdbook v0.5.4"
        test "$(deno --version | awk 'NR == 1 {print $2}')" = "2.9.7"
    - name: Install frozen workspace
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
