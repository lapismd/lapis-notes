name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package candidate after approval
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: lapis-public-release
  cancel-in-progress: false

jobs:
  changesets:
    name: Version packages
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:8fb0ecf5e978c9b44acd8394d78f689d93404f30f8014861a10a7eb2b90b96b8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - id: changesets
        uses: changesets/action@v1.8.0
        with:
          version: pnpm release:version
          commitMode: github-api
          title: "chore: version Lapis packages"
          commit: "chore: version Lapis packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validation:
    name: Validate release candidate
    needs: changesets
    if: needs.changesets.outputs.hasChangesets != 'true'
    uses: ./.github/workflows/lapis-ci.yml
    secrets: inherit

  publish:
    name: Publish packages
    needs: validation
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.validation.outputs.has_work == 'true' && needs.validation.outputs.bootstrap_required != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:8fb0ecf5e978c9b44acd8394d78f689d93404f30f8014861a10a7eb2b90b96b8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    environment:
      name: npm-production
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - run: npm config set registry https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: lapis-notes-release-${{ github.sha }}
          path: .release
      - run: pnpm release:publish
        env:
          LAPIS_RELEASE_APPROVED: "1"

  verify:
    name: Verify published packages
    needs:
      - validation
      - publish
    if: always() && needs.validation.outputs.has_work == 'true' && needs.validation.outputs.bootstrap_required != 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:8fb0ecf5e978c9b44acd8394d78f689d93404f30f8014861a10a7eb2b90b96b8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v8
        with:
          name: lapis-notes-release-${{ github.sha }}
          path: .release
      - run: pnpm release:verify

  notes:
    name: Create GitHub releases
    needs:
      - validation
      - verify
    if: always() && needs.validation.outputs.has_work == 'true' && needs.validation.outputs.bootstrap_required != 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:8fb0ecf5e978c9b44acd8394d78f689d93404f30f8014861a10a7eb2b90b96b8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v8
        with:
          name: lapis-notes-release-${{ github.sha }}
          path: .release
      - run: pnpm release:notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
