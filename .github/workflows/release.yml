name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package candidate after approval
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: lapis-public-release
  cancel-in-progress: false

env:
  LAPIS_NOTES_VALIDATION_RUNTIME: native

jobs:
  resolve-image:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/resolve-dependency-image.yml
    with:
      artifact-name: release-dependency-image

  changesets:
    name: Version packages
    if: github.ref == 'refs/heads/main'
    needs: resolve-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve-image.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - name: Mint repository-scoped version PR token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm release:version
          commitMode: github-api
          createGithubReleases: false
          title: "chore: version Lapis packages"
          commit: "chore: version Lapis packages"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  validation:
    name: Validate release candidate
    needs: changesets
    if: needs.changesets.outputs.hasChangesets != 'true'
    uses: ./.github/workflows/lapis-ci.yml
    secrets: inherit

  publish:
    name: Publish packages
    needs:
      - resolve-image
      - validation
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.validation.outputs.has_work == 'true' && needs.validation.outputs.bootstrap_required != 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    environment:
      name: npm-production
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - run: npm config set registry https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: lapis-notes-release-${{ github.sha }}
          path: .release
      - run: pnpm release:publish
        env:
          LAPIS_RELEASE_APPROVED: "1"

  verify:
    name: Verify published packages
    needs:
      - resolve-image
      - validation
      - publish
    if: always() && needs.validation.outputs.has_work == 'true' && needs.validation.outputs.bootstrap_required != 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve-image.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v8
        with:
          name: lapis-notes-release-${{ github.sha }}
          path: .release
      - name: Prepare the source-pinned Notes registry readiness policy
        uses: lapismd/lapis-ci/actions/setup-registry-readiness@89f3ede90d31058c59c771c86e433cee2bbd4407
      - run: pnpm release:verify

  notes:
    name: Create GitHub releases
    needs:
      - resolve-image
      - validation
      - verify
    if: always() && needs.validation.outputs.has_work == 'true' && needs.validation.outputs.bootstrap_required != 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v8
        with:
          name: lapis-notes-release-${{ github.sha }}
          path: .release
      - run: pnpm release:notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  notify-dependencies:
    name: Notify dependency consumers
    needs:
      - verify
    if: always() && needs.verify.result == 'success'
    permissions:
      contents: read
    uses: lapismd/dependency-automation/.github/workflows/notify.yml@ea9d35b12b612467bbabf1c6271ffa41b5eda4ba
    with:
      automation-ref: ea9d35b12b612467bbabf1c6271ffa41b5eda4ba
      source-sha: ${{ github.sha }}
    secrets:
      app-private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
