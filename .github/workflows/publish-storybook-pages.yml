name: Publish Storybook Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: lapis-storybook-pages
  cancel-in-progress: true

env:
  LAPIS_NOTES_VALIDATION_RUNTIME: native
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:91341a81cc9306eed818c4c433cd29ed11d2ea64c703f32685391befe0eca503
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Restore package builds
        run: node scripts/run-turbo.mjs build --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary
      - run: node scripts/run-turbo.mjs ci:storybook-static --summarize
      - name: Report Storybook cache result
        run: node scripts/report-turbo-cache.mjs --github-summary
      - name: Verify Storybook output
        run: |
          test -f storybook-static/index.html
          test -f storybook-static/iframe.html
          test -f storybook-static/index.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    name: Deploy Storybook
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
