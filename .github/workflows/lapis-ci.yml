name: Lapis CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      bootstrap_required:
        description: Whether the candidate contains packages that need bootstrap publication.
        value: ${{ jobs.release-artifacts.outputs.bootstrap_required }}
      has_work:
        description: Whether the candidate contains publishable packages.
        value: ${{ jobs.release-artifacts.outputs.has_work }}

permissions:
  contents: read
  packages: read

concurrency:
  group: lapis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  LAPIS_NOTES_VALIDATION_RUNTIME: native
  LAPIS_BUILD_COMMIT: ${{ github.sha }}
  LAPIS_PLUGIN_CANDIDATE_COMMIT: "da7d8bb73541eb3421ca8fdfaf1eaaf2baecc850"
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:91341a81cc9306eed818c4c433cd29ed11d2ea64c703f32685391befe0eca503
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Populate signed remote build cache
        run: node scripts/run-turbo.mjs build --summarize
      - name: Report build-cache result
        run: node scripts/report-turbo-cache.mjs --github-summary

  governance:
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:91341a81cc9306eed818c4c433cd29ed11d2ea64c703f32685391befe0eca503
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - run: pnpm spec:validate
      - run: pnpm check:specification-docs
      - run: pnpm spec:build
      - name: Spec-first gate
        if: >-
          (github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main') && !(github.event.pull_request.user.type == 'Bot' && (contains(fromJSON('["dependabot[bot]","renovate[bot]","lapismd-dependency-bot[bot]"]'), github.event.pull_request.user.login) || (vars.LAPIS_DEPENDENCY_BOT_LOGIN != '' && github.event.pull_request.user.login == vars.LAPIS_DEPENDENCY_BOT_LOGIN)))
        run: pnpm spec:first --base "origin/${{ github.base_ref }}" --head "${{ github.sha }}"
      - name: Release intent gate
        if: >-
          github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm release:intent --base "origin/${{ github.base_ref }}" --head "${{ github.sha }}"

  quality:
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:91341a81cc9306eed818c4c433cd29ed11d2ea64c703f32685391befe0eca503
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - run: pnpm packages:policy
      - run: pnpm release:check
      - run: pnpm check:no-tailwind
      - run: pnpm check:app-ownership
      - run: pnpm check:metadata-queries
      - name: Run package checks
        run: node scripts/run-turbo.mjs build check --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary

  unit:
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:91341a81cc9306eed818c4c433cd29ed11d2ea64c703f32685391befe0eca503
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Run package unit tests
        run: node scripts/run-turbo.mjs build test --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary
      - run: pnpm test:local-plugin-consumer
      - run: pnpm release:test
      - run: pnpm test:spec-validation
      - run: pnpm test:ai:smoke-harness

  storybook-static:
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:91341a81cc9306eed818c4c433cd29ed11d2ea64c703f32685391befe0eca503
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Restore package builds
        run: node scripts/run-turbo.mjs build --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary
      - run: node scripts/run-turbo.mjs ci:storybook-static --summarize
      - name: Report Storybook cache result
        run: node scripts/report-turbo-cache.mjs --github-summary

  storybook-interaction:
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:91341a81cc9306eed818c4c433cd29ed11d2ea64c703f32685391befe0eca503
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Restore package builds
        run: node scripts/run-turbo.mjs build --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary
      - run: node scripts/run-turbo.mjs ci:storybook-interaction --summarize
      - name: Report Storybook cache result
        run: node scripts/report-turbo-cache.mjs --github-summary

  registry-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:91341a81cc9306eed818c4c433cd29ed11d2ea64c703f32685391befe0eca503
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout the exact Plugins validation candidate
        uses: actions/checkout@v7
        with:
          repository: lapismd/lapis-plugins
          ref: ${{ env.LAPIS_PLUGIN_CANDIDATE_COMMIT }}
          path: .ci-candidates/plugins
      - name: Build test-signed registry candidate
        working-directory: .ci-candidates/plugins
        run: |
          test "$(git rev-parse HEAD)" = "$LAPIS_PLUGIN_CANDIDATE_COMMIT"
          export GITHUB_SHA="$LAPIS_PLUGIN_CANDIDATE_COMMIT"
          pnpm install --frozen-lockfile
          node scripts/check-framework-publication.mjs
          pnpm build
          pnpm packages:pack -- --already-built
          pnpm plugin:build
          node scripts/create-registry-acceptance-fixture.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: signed-registry-acceptance-fixture
          path: .ci-candidates/plugins/.release/registry-acceptance
          if-no-files-found: error
          retention-days: 14

  web-acceptance:
    needs: [build-cache, registry-fixture]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Restore package builds
        run: node scripts/run-turbo.mjs build --summarize
      - uses: actions/download-artifact@v8
        with:
          name: signed-registry-acceptance-fixture
          path: .ci-candidates/registry-fixture
      - run: pnpm test:web:e2e
        env:
          LAPIS_WEB_REGISTRY_FIXTURE: .ci-candidates/registry-fixture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-acceptance-diagnostics
          path: packages/web/test-results
          retention-days: 14

  release-artifacts:
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      bootstrap_required: ${{ steps.plan.outputs.bootstrap_required }}
      has_work: ${{ steps.plan.outputs.has_work }}
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:91341a81cc9306eed818c4c433cd29ed11d2ea64c703f32685391befe0eca503
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Restore package builds
        run: node scripts/run-turbo.mjs build --summarize
      - name: Report cache restoration
        run: node scripts/report-turbo-cache.mjs --github-summary
      - run: pnpm packages:pack -- --already-built
      - run: pnpm release:plan -- --registry https://registry.npmjs.org --json > .release/release-plan.json
        env:
          GH_TOKEN: ${{ github.token }}
      - id: plan
        run: |
          node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(".release/release-manifest.json","utf8"));const hasWork=m.packages.length>0;const bootstrap=Boolean(m.bootstrapRequired);fs.appendFileSync(process.env.GITHUB_OUTPUT,"has_work="+hasWork+"\nbootstrap_required="+bootstrap+"\n");if(bootstrap){console.log("::notice ::Initial packages require manual npm publication from the verified release artifact.");}'
      - uses: actions/upload-artifact@v7
        with:
          name: lapis-notes-release-${{ github.sha }}
          path: .release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  web-cloudflare:
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/lapismd/lapis-ci@sha256:91341a81cc9306eed818c4c433cd29ed11d2ea64c703f32685391befe0eca503
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Build the ordinary production PWA
        run: pnpm build:web
      - name: Test static asset packaging and HTTP semantics
        run: pnpm web:cloudflare:test
      - name: Prepare the deployment artifact
        run: pnpm web:cloudflare:prepare
      - name: Qualify the exact artifact in Wrangler
        run: pnpm web:cloudflare:acceptance
      - uses: actions/upload-artifact@v7
        with:
          name: lapis-pwa-${{ github.sha }}
          path: .cloudflare
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  validate:
    if: always()
    needs:
      - build-cache
      - governance
      - quality
      - unit
      - storybook-static
      - storybook-interaction
      - web-acceptance
      - web-cloudflare
      - registry-fixture
      - release-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate blocking validation lanes
        env:
          BUILD_CACHE: ${{ needs.build-cache.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          STORYBOOK_STATIC: ${{ needs.storybook-static.result }}
          STORYBOOK_INTERACTION: ${{ needs.storybook-interaction.result }}
          WEB_ACCEPTANCE: ${{ needs.web-acceptance.result }}
          WEB_CLOUDFLARE: ${{ needs.web-cloudflare.result }}
          REGISTRY_FIXTURE: ${{ needs.registry-fixture.result }}
          RELEASE_ARTIFACTS: ${{ needs.release-artifacts.result }}
        run: |
          set -euo pipefail
          results=(
            "$BUILD_CACHE"
            "$GOVERNANCE"
            "$QUALITY"
            "$UNIT"
            "$STORYBOOK_STATIC"
            "$STORYBOOK_INTERACTION"
            "$WEB_ACCEPTANCE"
            "$WEB_CLOUDFLARE"
            "$REGISTRY_FIXTURE"
            "$RELEASE_ARTIFACTS"
          )
          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "A required CI lane finished with: $result" >&2
              exit 1
            fi
          done
          echo "All blocking Lapis Notes validation lanes passed."
