name: Publish verified dependency image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .ci/dependency-image.Dockerfile
      - .ci/images.json
      - .github/workflows/dependency-image.yml
      - package.json
      - packages/**/package.json
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/lib/ci-images.mjs
      - scripts/prepare-ci-dependency-context.mjs

permissions:
  contents: read
  attestations: write
  id-token: write
  packages: write

concurrency:
  group: dependency-image-${{ github.repository }}
  cancel-in-progress: false

env:
  LAPIS_NOTES_VALIDATION_RUNTIME: native

jobs:
  publish:
    if: github.repository == 'lapismd/lapis-notes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Prepare dependency-only build context
        id: context
        run: node scripts/prepare-ci-dependency-context.mjs --github-output "$GITHUB_OUTPUT"
      - name: Reuse or publish the signed complete-input identity
        id: publish
        uses: lapismd/lapis-ci/actions/publish-dependency-image@29d83b5a61c0cf2b895873489de43f0d85e38e48
        with:
          context: .ci/dependency-context
          base-image: ${{ steps.context.outputs.base_image }}
          image: ${{ steps.context.outputs.dependency_image }}
      - name: Retain publication inputs and verified immutable result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/dependency-image-receipt.json
            .ci/dependency-image-resolution.json
            .ci/dependency-image-publication.json
          if-no-files-found: warn
          retention-days: 14
