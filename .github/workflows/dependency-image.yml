name: Publish lockfile CI image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .ci/dependency-image.Dockerfile
      - .github/workflows/dependency-image.yml
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/ci-images.test.mjs
      - scripts/lib/ci-images.mjs
      - scripts/prepare-ci-dependency-context.mjs
      - scripts/update-ci-image-manifest.mjs

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write
  pull-requests: write

concurrency:
  group: dependency-image-${{ github.ref }}
  cancel-in-progress: true

env:
  LAPIS_NOTES_VALIDATION_RUNTIME: native

jobs:
  publish:
    if: github.repository == 'lapismd/lapis-notes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Prepare dependency-only build context
        id: image
        run: node scripts/prepare-ci-dependency-context.mjs --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.dependency_image }}
          tags: type=raw,value=${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
      - name: Build and publish multi-architecture dependency image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .ci/dependency-context
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest dependency image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.dependency_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify and propose immutable digest pin
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/update-ci-image-manifest.mjs "$IMAGE_DIGEST"
          pin_paths=(
            .ci/images.json
            spec/src/architecture/dependency-boundaries.md
            spec/src/packages/releases-and-exports.md
            spec/src/spec-governance/protected-change-mapping.md
          )
          branch="automation/lapis-notes-ci"
          open_pr_number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          close_legacy_prs() {
            legacy_pr_numbers="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq '
              .[]
              | select(.user.login == "github-actions[bot]" and .head.repo.full_name == .base.repo.full_name)
              | select(.head.ref | test("^automation/lapis-notes-ci-lock-[a-f0-9]{16}$"))
              | .number
            ')"
            while IFS= read -r number; do
              if [[ -n "$number" ]]; then
                gh pr close "$number"
              fi
            done <<< "$legacy_pr_numbers"
          }
          if git diff --quiet -- "${pin_paths[@]}"; then
            if [[ -n "$open_pr_number" ]]; then
              gh pr close "$open_pr_number"
            fi
            close_legacy_prs
            echo "The checked-in dependency image digest is current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "${pin_paths[@]}"
          git commit -m "chore(ci): pin ${IMAGE_TAG} dependency image"
          git push --force origin "HEAD:refs/heads/$branch"
          if [[ -n "$open_pr_number" ]]; then
            gh pr edit "$open_pr_number" --title "chore(ci): pin ${IMAGE_TAG} dependency image" --body "Pins the verified multi-architecture dependency image built from the current lockfile and records its digest, tag, and lockfile hash in every mapped canonical chapter."
          else
            gh pr create --head "$branch" --base main --title "chore(ci): pin ${IMAGE_TAG} dependency image" --body "Pins the verified multi-architecture dependency image built from the current lockfile and records its digest, tag, and lockfile hash in every mapped canonical chapter."
          fi
          close_legacy_prs
          echo "Published ${IMAGE_TAG} at ${IMAGE_DIGEST}." >> "$GITHUB_STEP_SUMMARY"
