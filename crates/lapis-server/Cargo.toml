[package]
name = "lapis-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Hosted HTTP adapter for shared Lapis native application services"

[dependencies]
lapis-app-core = { path = "../lapis-app-core" }
lapis-app-protocol = { path = "../lapis-app-protocol" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
mime_guess = "=2.0.5"
tempfile = "=3.27.0"
tokio-util = { version = "=0.7.20", features = ["io"] }
subtle = "=2.6.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["process", "io-util", "time"] }
