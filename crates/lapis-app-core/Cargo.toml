[package]
name = "lapis-app-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Transport-independent native application services for Lapis Notes"

[dependencies]
cap-std = "=4.0.3"
cap-tempfile = "=4.0.3"
libc = "0.2"
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
